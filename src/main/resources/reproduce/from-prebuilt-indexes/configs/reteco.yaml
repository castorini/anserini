conditions:
  - name: bm25-train
    display: "BM25, bag-of-words baseline (train)"
    short_name: "BM25 (train)"
    command: io.anserini.search.SearchCollection -threads 2 -index reteco-v1.1-track1-$topics -topics reteco-v1.1-track1a-$topics.train -output $output -bm25 -bm25.k1 0.9 -bm25.b 0.4 -hits 1000
    topics:
      - topic_key: bitcoin
        eval_key: reteco-v1.1-track1a-bitcoin.train
        expected_scores:
          nDCG@10: 0.0468
        metric_definitions:
          nDCG@10: "-c -m ndcg_cut.10"
      - topic_key: cardano
        eval_key: reteco-v1.1-track1a-cardano.train
