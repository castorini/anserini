---
corpus: reteco-v1.1-track1-law
corpus_path: collections/reteco/track1_tempo/law
index_path: indexes/lucene-inverted.reteco-v1.1-track1-law/
collection_class: JsonCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 2
index_options: -storePositions -storeDocvectors -storeRaw -optimize

index_stats:
  documents: 36110
  documents (non-empty): 36110
  total terms: 8986854

metrics:
  - metric: nDCG@10
    command: bin/trec_eval
    params: -c -m ndcg_cut.10
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@1000
    command: bin/trec_eval
    params: -c -m recall.1000
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false

topic_reader: TsvString
topics:
  - name: "RETECO: Law, Track 1a, train"
    id: reteco-v1.1-track1a-law.train
    qrels: reteco-v1.1-track1a-law.train
  - name: "RETECO: Law, Track 1a, dev"
    id: reteco-v1.1-track1a-law.dev
    qrels: reteco-v1.1-track1a-law.dev

models:
  - name: bm25
    display: BM25
    params: -bm25 -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.0399
        - 0.0294
      R@100:
        - 0.2701
        - 0.2909
      R@1000:
        - 0.7243
        - 0.5212
  - name: bm25qs
    display: BM25QS
    params: -bm25.querySide -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.0905
        - 0.0574
      R@100:
        - 0.3271
        - 0.3515
      R@1000:
        - 0.7660
        - 0.6318
