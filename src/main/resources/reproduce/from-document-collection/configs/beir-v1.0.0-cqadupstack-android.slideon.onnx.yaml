---
corpus: beir-v1.0.0-cqadupstack-android.slideon
corpus_path: collections/beir-v1.0.0/slideon-jsonl/cqadupstack-android

index_path: indexes/lucene-inverted.beir-v1.0.0-cqadupstack-android.slideon/
collection_class: JsonVectorCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 16
index_options: -impact -pretokenized
index_stats:
  documents: 22998

metrics:
  - metric: nDCG@10
    command: bin/trec_eval
    params: -c -m ndcg_cut.10
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@1000
    command: bin/trec_eval
    params: -c -m recall.1000
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false

topic_reader: TsvString
topics:
  - name: 'BEIR (v1.0.0): CQADupStack-android'
    id: beir-cqadupstack-android
    qrels: beir-v1.0.0-cqadupstack-android.test

models:
  - name: slideon-onnx
    display: SlideOn (ONNX), d512/q64, scale 100
    params: -impact -pretokenized -hits 1000 -encoder SlideOn -removeQuery
    results:
      nDCG@10:
        - 0.4772
      R@100:
        - 0.8299
      R@1000:
        - 0.9552
