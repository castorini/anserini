---
corpus: reteco-v1.1-track1-quant
corpus_path: collections/reteco/track1_tempo/quant
index_path: indexes/lucene-inverted.reteco-v1.1-track1-quant/
collection_class: JsonCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 2
index_options: -storePositions -storeDocvectors -storeRaw -optimize

index_stats:
  documents: 25040
  documents (non-empty): 25037
  total terms: 5516531

metrics:
  - metric: nDCG@10
    command: bin/trec_eval
    params: -c -m ndcg_cut.10
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@1000
    command: bin/trec_eval
    params: -c -m recall.1000
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false

topic_reader: TsvString
topics:
  - name: "RETECO: Quant, Track 1a, train"
    id: reteco-v1.1-track1a-quant.train
    qrels: reteco-v1.1-track1a-quant.train
  - name: "RETECO: Quant, Track 1a, dev"
    id: reteco-v1.1-track1a-quant.dev
    qrels: reteco-v1.1-track1a-quant.dev

models:
  - name: bm25
    display: BM25
    params: -bm25 -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.0128
        - 0.0000
      R@100:
        - 0.0764
        - 0.1000
      R@1000:
        - 0.4153
        - 0.4917
  - name: bm25qs
    display: BM25QS
    params: -bm25.querySide -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.0255
        - 0.0204
      R@100:
        - 0.1597
        - 0.2000
      R@1000:
        - 0.4771
        - 0.4250
