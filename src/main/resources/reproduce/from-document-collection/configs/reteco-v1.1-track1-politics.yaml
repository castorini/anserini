---
corpus: reteco-v1.1-track1-politics
corpus_path: collections/reteco/track1_tempo/politics
index_path: indexes/lucene-inverted.reteco-v1.1-track1-politics/
collection_class: JsonCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 2
index_options: -storePositions -storeDocvectors -storeRaw -optimize

index_stats:
  documents: 135207
  documents (non-empty): 135205
  total terms: 33418570

metrics:
  - metric: nDCG@10
    command: bin/trec_eval
    params: -c -m ndcg_cut.10
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@1000
    command: bin/trec_eval
    params: -c -m recall.1000
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false

topic_reader: TsvString
topics:
  - name: "RETECO: Politics, Track 1a, train"
    id: reteco-v1.1-track1a-politics.train
    qrels: reteco-v1.1-track1a-politics.train
  - name: "RETECO: Politics, Track 1a, dev"
    id: reteco-v1.1-track1a-politics.dev
    qrels: reteco-v1.1-track1a-politics.dev

models:
  - name: bm25
    display: BM25
    params: -bm25 -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.2664
        - 0.2129
      R@100:
        - 0.6060
        - 0.5059
      R@1000:
        - 0.8198
        - 0.7715
  - name: bm25qs
    display: BM25QS
    params: -bm25.querySide -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.2802
        - 0.2607
      R@100:
        - 0.5989
        - 0.5256
      R@1000:
        - 0.8325
        - 0.7567
