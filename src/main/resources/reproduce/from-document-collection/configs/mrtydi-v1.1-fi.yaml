---
corpus: mrtydi-v1.1-fi
corpus_path: collections/mr-tydi-corpus/mrtydi-v1.1-finnish/

index_path: indexes/lucene-inverted.mrtydi-v1.1-finnish/
collection_class: MrTyDiCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 1
index_options: -storePositions -storeDocvectors -storeRaw -language fi
index_stats:
  documents: 1908757
  documents (non-empty): 1908757
  total terms: 69416543

metrics:
  - metric: MRR@100
    command: bin/trec_eval
    params: -c -M 100 -m recip_rank
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: true
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: true

topic_reader: TsvInt
topics:
  - name: "[Mr. TyDi (Finnish): train](https://github.com/castorini/mr.tydi)"
    id: mrtydi-v1.1-fi.train
    qrels: mrtydi-v1.1-fi.train
  - name: "[Mr. TyDi (Finnish): dev](https://github.com/castorini/mr.tydi)"
    id: mrtydi-v1.1-fi.dev
    qrels: mrtydi-v1.1-fi.dev
  - name: "[Mr. TyDi (Finnish): test](https://github.com/castorini/mr.tydi)"
    id: mrtydi-v1.1-fi.test
    qrels: mrtydi-v1.1-fi.test

models:
  - name: bm25
    display: BM25
    params: -bm25 -hits 100 -language fi
    results:
      MRR@100:
        - 0.4101
        - 0.4136
        - 0.2836
      R@100:
        - 0.8198
        - 0.8285
        - 0.7196
