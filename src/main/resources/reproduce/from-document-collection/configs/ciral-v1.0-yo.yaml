---
corpus: ciral-yoruba
corpus_path: collections/ciral/ciral-passages-yoruba/

index_path: indexes/lucene-inverted.ciral-v1.0-yo/
collection_class: MrTyDiCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 16
index_options: -storePositions -storeDocvectors -storeRaw -language yo
index_stats:
  documents: 82095
  documents (non-empty): 82095
  total terms: 13693080

metrics:
  - metric: nDCG@20
    command: bin/trec_eval
    params: -c -m ndcg_cut.20
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false

topic_reader: TsvInt
topics:
  - name: "[CIRAL Yoruba: Test Set A (Shallow Judgements)](https://huggingface.co/datasets/CIRAL/ciral)"
    id: ciral-v1.0-yo-test-a-native
    qrels: ciral-v1.0-yo-test-a
  - name: "[CIRAL Yoruba: Test Set A (Pools)](https://huggingface.co/datasets/CIRAL/ciral)"
    id: ciral-v1.0-yo-test-a-native
    qrels: ciral-v1.0-yo-test-a-pools
  - name: "[CIRAL Yoruba: Test Set B](https://huggingface.co/datasets/CIRAL/ciral)"
    id: ciral-v1.0-yo-test-b-native
    qrels: ciral-v1.0-yo-test-b

models:
  - name: bm25-default
    display: BM25 (default)
    params: -bm25 -hits 1000 -language yo
    results:
      nDCG@20:
        - 0.4023
        - 0.3118
        - 0.3459
      R@100:
        - 0.6659
        - 0.4899
        - 0.6434
