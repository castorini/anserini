---
corpus: reteco-v1.1-track1-bitcoin
corpus_path: collections/reteco/track1_tempo/bitcoin
index_path: indexes/lucene-inverted.reteco-v1.1-track1-bitcoin/
collection_class: JsonCollection
generator_class: DefaultLuceneDocumentGenerator
index_threads: 2
index_options: -storePositions -storeDocvectors -storeRaw -optimize

index_stats:
  documents: 76706
  documents (non-empty): 76706
  total terms: 17207595

metrics:
  - metric: nDCG@10
    command: bin/trec_eval
    params: -c -m ndcg_cut.10
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@100
    command: bin/trec_eval
    params: -c -m recall.100
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false
  - metric: R@1000
    command: bin/trec_eval
    params: -c -m recall.1000
    separator: "\t"
    parse_index: 2
    metric_precision: 4
    can_combine: false

topic_reader: TsvString
topics:
  - name: "RETECO: Bitcoin, Track 1a, train"
    id: reteco-v1.1-track1a-bitcoin.train
    qrels: reteco-v1.1-track1a-bitcoin.train
  - name: "RETECO: Bitcoin, Track 1a, dev"
    id: reteco-v1.1-track1a-bitcoin.dev
    qrels: reteco-v1.1-track1a-bitcoin.dev

models:
  - name: bm25
    display: BM25
    params: -bm25 -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.0468
        - 0.0300
      R@100:
        - 0.1488
        - 0.2848
      R@1000:
        - 0.4914
        - 0.4907
  - name: bm25qs
    display: BM25QS
    params: -bm25.querySide -bm25.k1 0.9 -bm25.b 0.4 -hits 1000 -threads 2
    results:
      nDCG@10:
        - 0.0845
        - 0.0364
      R@100:
        - 0.2769
        - 0.2653
      R@1000:
        - 0.5157
        - 0.5700
